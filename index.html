<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mes Dessins">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#c2692a">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mes Dessins</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --cream: #faf8f4;
  --paper: #f5f1eb;
  --warm: #ede8e0;
  --ink: #1c1917;
  --ink2: #44403c;
  --ink3: #a8a29e;
  --accent: #c2692a;
  --accent2: #e8956d;
  --card-shadow: 0 2px 16px rgba(28,25,23,0.08), 0 1px 4px rgba(28,25,23,0.06);
  --card-shadow-hover: 0 8px 32px rgba(28,25,23,0.14), 0 2px 8px rgba(28,25,23,0.08);
}

html, body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overscroll-behavior: none;
}

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(250,248,244,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--warm);
  padding: 18px 20px 14px;
}

.header-top {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 14px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 28px; font-weight: 700;
  color: var(--ink);
  line-height: 1;
}
h1 em {
  font-style: italic; font-weight: 400;
  color: var(--accent);
}

.counter {
  font-size: 12px; font-weight: 400;
  color: var(--ink3);
  padding-bottom: 3px;
  letter-spacing: 0.3px;
}

/* ── SEARCH ── */
.search-wrap {
  position: relative;
}
.search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  pointer-events: none;
  color: var(--ink3);
}
#searchInput {
  width: 100%;
  background: var(--paper);
  border: 1.5px solid var(--warm);
  border-radius: 14px;
  padding: 11px 14px 11px 42px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; color: var(--ink);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
#searchInput::placeholder { color: var(--ink3); }
#searchInput:focus {
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(194,105,42,0.08);
}
.clear-search {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: var(--warm); border: none; cursor: pointer;
  width: 22px; height: 22px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  color: var(--ink3); font-size: 12px;
  transition: background 0.15s;
}
.clear-search.visible { display: flex; }
.clear-search:hover { background: #ddd9d3; color: var(--ink); }

/* ── GRID ── */
.grid-wrap { padding: 20px 16px 120px; }

.grid {
  columns: 2;
  column-gap: 12px;
}
@media (min-width: 500px) { .grid { columns: 3; } }
@media (min-width: 760px) { .grid { columns: 4; } }

.card {
  break-inside: avoid;
  margin-bottom: 12px;
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--card-shadow);
  cursor: pointer;
  position: relative;
  transition: transform 0.22s cubic-bezier(.34,1.4,.64,1), box-shadow 0.22s;
  animation: popIn 0.35s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.88) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.card:hover {
  transform: translateY(-3px) scale(1.015);
  box-shadow: var(--card-shadow-hover);
}
.card:active { transform: scale(0.97); }

.card img {
  width: 100%; display: block;
  object-fit: cover;
  background: var(--paper);
}

.card-label {
  padding: 8px 10px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.card-title {
  font-size: 12px; font-weight: 500;
  color: var(--ink2);
  line-height: 1.3;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.card-date {
  font-size: 10px; color: var(--ink3);
  white-space: nowrap; flex-shrink: 0;
}

.card-del {
  position: absolute; top: 7px; right: 7px;
  width: 26px; height: 26px; border-radius: 8px;
  background: rgba(255,255,255,0.88);
  border: 1px solid rgba(28,25,23,0.1);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 11px; color: var(--ink3);
  opacity: 0; transition: opacity 0.15s, background 0.15s;
  backdrop-filter: blur(4px);
}
.card:hover .card-del { opacity: 1; }
.card-del:hover { background: #fff; color: #c0392b; border-color: rgba(192,57,43,0.25); }

/* ── EMPTY ── */
.empty {
  text-align: center;
  padding: 64px 20px;
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.empty-art {
  font-size: 52px; margin-bottom: 16px;
  filter: grayscale(0.3) opacity(0.6);
}
.empty-title {
  font-family: 'Playfair Display', serif;
  font-size: 20px; color: var(--ink2);
  margin-bottom: 8px;
}
.empty-sub { font-size: 14px; color: var(--ink3); line-height: 1.6; }

/* ── FAB ── */
.fab {
  position: fixed; bottom: 28px; right: 20px; z-index: 60;
  width: 58px; height: 58px; border-radius: 18px;
  background: var(--accent);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(194,105,42,0.4), 0 1px 4px rgba(28,25,23,0.15);
  transition: transform 0.2s cubic-bezier(.34,1.4,.64,1), box-shadow 0.2s;
}
.fab:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 28px rgba(194,105,42,0.5);
}
.fab:active { transform: scale(0.94); }
.fab svg { color: #fff; }

/* ── OVERLAY ── */
.overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(15,12,10,0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
  padding: 0;
}
.overlay.open { opacity: 1; pointer-events: all; }

/* ── ADD SHEET ── */
.sheet {
  background: var(--cream);
  border-radius: 24px 24px 0 0;
  width: 100%; max-width: 520px;
  padding: 0 0 32px;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(.32,0,.15,1);
  max-height: 92vh;
  overflow-y: auto;
}
.overlay.open .sheet { transform: translateY(0); }

.sheet-handle {
  width: 36px; height: 4px;
  background: var(--warm); border-radius: 2px;
  margin: 14px auto 20px;
}

.sheet-title {
  font-family: 'Playfair Display', serif;
  font-size: 20px; font-weight: 700;
  padding: 0 20px; margin-bottom: 20px;
  color: var(--ink);
}

/* ── UPLOAD ZONE ── */
.upload-zone {
  margin: 0 20px 18px;
  border-radius: 16px;
  overflow: hidden;
  background: var(--paper);
  border: 2px dashed var(--warm);
  position: relative;
  transition: border-color 0.2s;
  cursor: pointer;
  min-height: 180px;
  display: flex; align-items: center; justify-content: center;
}
.upload-zone:hover { border-color: var(--accent2); }
.upload-zone.filled { border-style: solid; border-color: transparent; min-height: 0; }
.upload-zone input[type="file"] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.upload-placeholder {
  text-align: center; padding: 28px 20px; pointer-events: none;
}
.upload-placeholder .cam { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }
.upload-placeholder p {
  font-size: 13px; color: var(--ink3); line-height: 1.7;
}
.upload-placeholder strong { font-weight: 500; color: var(--accent); }
#previewImg {
  width: 100%; display: block;
  border-radius: 14px;
  max-height: 260px; object-fit: contain;
}

/* ── INPUT ── */
.field { padding: 0 20px; margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 1px;
  color: var(--ink3); margin-bottom: 7px;
}
.field input {
  width: 100%;
  background: var(--paper);
  border: 1.5px solid var(--warm);
  border-radius: 12px;
  padding: 13px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px; color: var(--ink);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.field input::placeholder { color: var(--ink3); }
.field input:focus {
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(194,105,42,0.08);
}

.btn-add {
  display: block; width: calc(100% - 40px);
  margin: 18px 20px 0;
  background: var(--accent);
  color: #fff; border: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 500;
  padding: 15px;
  border-radius: 14px;
  transition: background 0.15s, transform 0.15s;
}
.btn-add:hover { background: #b05c25; }
.btn-add:active { transform: scale(0.98); }
.btn-add:disabled { background: var(--warm); color: var(--ink3); cursor: not-allowed; }

/* ── LIGHTBOX ── */
.lb-box {
  background: var(--cream);
  border-radius: 24px 24px 0 0;
  width: 100%; max-width: 520px;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(.32,0,.15,1);
  overflow: hidden;
  max-height: 95vh;
  display: flex; flex-direction: column;
}
.overlay.open .lb-box { transform: translateY(0); }

.lb-img-wrap {
  flex: 1; overflow: hidden;
  background: var(--paper);
  position: relative;
}
.lb-img-wrap img {
  width: 100%; height: 100%;
  object-fit: contain;
  max-height: 72vh;
  display: block;
}
.lb-footer {
  padding: 16px 20px 32px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--warm);
}
.lb-info {}
.lb-title {
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-weight: 700; color: var(--ink);
  margin-bottom: 3px;
}
.lb-date { font-size: 12px; color: var(--ink3); }
.lb-close {
  background: var(--paper); border: 1.5px solid var(--warm);
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink3); font-size: 16px;
  flex-shrink: 0; transition: background 0.15s;
}
.lb-close:hover { background: var(--warm); color: var(--ink); }

/* highlight */
mark { background: rgba(194,105,42,0.18); border-radius: 3px; padding: 0 1px; color: inherit; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Mes <em>dessins</em></h1>
    <span class="counter" id="counter">0 dessin</span>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Rechercher un dessin…" autocomplete="off" oninput="onSearch()">
    <button class="clear-search" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
</header>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<button class="fab" onclick="openSheet()" title="Ajouter un dessin">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- ADD SHEET -->
<div class="overlay" id="addOverlay" onclick="handleBgClick(event,'addOverlay',closeSheet)">
  <div class="sheet" id="addSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Nouveau dessin</div>

    <div class="upload-zone" id="uploadZone">
      <input type="file" accept="image/*" capture="environment" id="fileInput" onchange="onFile(event)">
      <div class="upload-placeholder" id="uploadPlaceholder">
        <div class="cam">📷</div>
        <p><strong>Prendre une photo</strong> ou choisir<br>depuis la galerie</p>
      </div>
      <img id="previewImg" style="display:none;">
    </div>

    <div class="field">
      <label>Titre du dessin</label>
      <input type="text" id="titleInput" placeholder="Ex: Paysage de montagne…" maxlength="80" oninput="checkReady()">
    </div>

    <button class="btn-add" id="addBtn" disabled onclick="addDrawing()">Enregistrer</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="overlay" id="lbOverlay" onclick="handleBgClick(event,'lbOverlay',closeLb)">
  <div class="lb-box" id="lbBox">
    <div class="lb-img-wrap">
      <img id="lbImg" src="" alt="">
    </div>
    <div class="lb-footer">
      <div class="lb-info">
        <div class="lb-title" id="lbTitle"></div>
        <div class="lb-date" id="lbDate"></div>
      </div>
      <button class="lb-close" onclick="closeLb()">✕</button>
    </div>
  </div>
</div>

<script>
let drawings = JSON.parse(localStorage.getItem('drawings_v2') || '[]');
let pendingImg = null;
let query = '';

function save() { localStorage.setItem('drawings_v2', JSON.stringify(drawings)); }

function fmt(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' });
}

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function render() {
  const grid = document.getElementById('grid');
  const q = query.trim().toLowerCase();
  const list = q ? drawings.filter(d => d.title.toLowerCase().includes(q)) : drawings;

  document.getElementById('counter').textContent =
    drawings.length + ' dessin' + (drawings.length !== 1 ? 's' : '');

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty" style="column-span:all">
      <div class="empty-art">${q ? '🔍' : '✏️'}</div>
      <div class="empty-title">${q ? 'Aucun résultat' : 'Aucun dessin encore'}</div>
      <div class="empty-sub">${q ? 'Essaie un autre titre.' : 'Appuie sur + pour ajouter<br>ton premier dessin.'}</div>
    </div>`;
    return;
  }

  grid.innerHTML = list.map((d, i) => `
    <div class="card" style="animation-delay:${Math.min(i,12)*0.035}s" onclick="openLb('${d.id}')">
      <img src="${d.img}" alt="${d.title}" loading="lazy">
      <div class="card-label">
        <div class="card-title">${highlight(d.title, q)}</div>
        <div class="card-date">${fmt(d.ts)}</div>
      </div>
      <button class="card-del" onclick="del(event,'${d.id}')" title="Supprimer">✕</button>
    </div>
  `).join('');
}

function onSearch() {
  query = document.getElementById('searchInput').value;
  document.getElementById('clearBtn').classList.toggle('visible', query.length > 0);
  render();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  query = '';
  document.getElementById('clearBtn').classList.remove('visible');
  render();
}

function openSheet() {
  document.getElementById('addOverlay').classList.add('open');
  setTimeout(() => document.getElementById('titleInput').focus(), 380);
}
function closeSheet() {
  document.getElementById('addOverlay').classList.remove('open');
  pendingImg = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('previewImg').src = '';
  document.getElementById('uploadPlaceholder').style.display = '';
  document.getElementById('uploadZone').classList.remove('filled');
  document.getElementById('titleInput').value = '';
  document.getElementById('addBtn').disabled = true;
}

function onFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    pendingImg = ev.target.result;
    const img = document.getElementById('previewImg');
    img.src = pendingImg;
    img.style.display = 'block';
    document.getElementById('uploadPlaceholder').style.display = 'none';
    document.getElementById('uploadZone').classList.add('filled');
    checkReady();
    // auto-focus title
    setTimeout(() => document.getElementById('titleInput').focus(), 100);
  };
  reader.readAsDataURL(file);
}

function checkReady() {
  const t = document.getElementById('titleInput').value.trim();
  document.getElementById('addBtn').disabled = !(t && pendingImg);
}

function addDrawing() {
  const title = document.getElementById('titleInput').value.trim();
  if (!title || !pendingImg) return;
  drawings.unshift({ id: 'D' + Date.now(), title, img: pendingImg, ts: Date.now() });
  save();
  closeSheet();
  render();
}

function del(e, id) {
  e.stopPropagation();
  drawings = drawings.filter(d => d.id !== id);
  save(); render();
}

function openLb(id) {
  const d = drawings.find(x => x.id === id);
  if (!d) return;
  document.getElementById('lbImg').src = d.img;
  document.getElementById('lbTitle').textContent = d.title;
  document.getElementById('lbDate').textContent = fmt(d.ts);
  document.getElementById('lbOverlay').classList.add('open');
}
function closeLb() { document.getElementById('lbOverlay').classList.remove('open'); }

function handleBgClick(e, id, fn) {
  if (e.target === document.getElementById(id)) fn();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); closeLb(); }
});

// drag & drop on upload zone
const zone = document.getElementById('uploadZone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor = '#c2692a'; });
zone.addEventListener('dragleave', () => { zone.style.borderColor = ''; });
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.style.borderColor = '';
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    const dt = new DataTransfer(); dt.items.add(file);
    document.getElementById('fileInput').files = dt.files;
    document.getElementById('fileInput').dispatchEvent(new Event('change'));
  }
});

render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
</body>
</html>
